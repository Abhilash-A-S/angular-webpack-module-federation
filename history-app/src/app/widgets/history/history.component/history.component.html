<section class="mfe-container history-widget">
  <h3 class="widget-title">My Task History</h3>
  <div class="timeline">
    <div 
      *ngFor="let item of historyEntries" 
      class="timeline-item"
      [class.status-checked]="item.action === 'COMPLETED'">
      <span class="time">{{ item.timestamp }}</span>
      <div class="timeline-content">
        <strong>{{ item.taskTitle }}</strong>
        <p>({{ item.details }})</p>
      </div>
    </div>
  </div>
</section>
