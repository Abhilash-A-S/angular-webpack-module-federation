<div class="dashboard-shell">
  <header class="global-header">
    <div class="logo-area">
      <span class="icon">⏱️</span>
      <span class="logo-text">TaskFlow</span>
    </div>
    <nav class="main-nav">
      <a href="#" class="nav-item" [class.active]="activeTab === 'dashboard'" (click)="setActiveTab('dashboard', $event)">Dashboard</a>
      <a href="#" class="nav-item" [class.active]="activeTab === 'tasks'" (click)="setActiveTab('tasks', $event)">My Tasks</a>
      <a href="#" class="nav-item" [class.active]="activeTab === 'calendar'" (click)="setActiveTab('calendar', $event)">Calendar</a>
      <a href="#" class="nav-item" [class.active]="activeTab === 'reports'" (click)="setActiveTab('reports', $event)">Reports</a>
      <a href="#" class="nav-item" [class.active]="activeTab === 'history'" (click)="setActiveTab('history', $event)">History</a>
    </nav>
    <div class="user-profile">
      <span class="avatar">AS</span>
      <span class="username">Alistair Smith</span>
      <button class="settings-btn">⚙️</button>
    </div>
  </header>

  <!-- Dashboard View (Full Grid) -->
  <main class="workspace-grid" *ngIf="activeTab === 'dashboard'">
    <section class="mfe-container todo-workspace">
      <app-remote-loader remoteEntry="http://localhost:4203/remoteEntry.js" exposedModule="./TodoWidget"
        exportName="TodoWidgetComponent">
      </app-remote-loader>
    </section>

    <div class="sidebar-column">
      <app-remote-loader remoteEntry="http://localhost:4201/remoteEntry.js" exposedModule="./ClockWidget"
        exportName="ClockWidgetComponent">
      </app-remote-loader>
      <app-remote-loader remoteEntry="http://localhost:4201/remoteEntry.js" exposedModule="./Alertbanner"
        exportName="AlertBannerComponent">
      </app-remote-loader>
      <app-remote-loader remoteEntry="http://localhost:4202/remoteEntry.js" exposedModule="./HistoryWidget"
        exportName="HistoryWidgetComponent">
      </app-remote-loader>
    </div>
  </main>

  <!-- My Tasks View -->
  <main class="single-workspace" *ngIf="activeTab === 'tasks'">
    <section class="mfe-container todo-workspace">
      <app-remote-loader remoteEntry="http://localhost:4203/remoteEntry.js" exposedModule="./TodoWidget"
        exportName="TodoWidgetComponent">
      </app-remote-loader>
    </section>
  </main>

  <!-- Calendar View -->
  <main class="single-workspace" *ngIf="activeTab === 'calendar'">
    <section class="mfe-container calendar-workspace">
      <h2>Scheduled Calendar</h2>
      <p class="subtitle" style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.85rem;">Upcoming Task Timeline & Schedule View</p>
      <div class="calendar-preview">
        <app-remote-loader remoteEntry="http://localhost:4201/remoteEntry.js" exposedModule="./ClockWidget"
          exportName="ClockWidgetComponent">
        </app-remote-loader>
        <div style="margin-top: 20px;">
          <app-remote-loader remoteEntry="http://localhost:4203/remoteEntry.js" exposedModule="./TodoWidget"
            exportName="TodoWidgetComponent">
          </app-remote-loader>
        </div>
      </div>
    </section>
  </main>

  <!-- Reports View -->
  <main class="single-workspace" *ngIf="activeTab === 'reports'">
    <section class="mfe-container reports-workspace">
      <h2>Taskflow Reports & Analytics</h2>
      <p class="subtitle" style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.85rem;">Real-time Task Completion & Productivity Metrics</p>
      <div class="reports-summary" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px;">
        <div style="background: #222930; padding: 20px; border-radius: 8px; border: 1px solid #2a333c;">
          <h3 style="font-size: 0.9rem; color: #8a99a8;">Active Tasks</h3>
          <p style="font-size: 2rem; font-weight: bold; color: #3b82f6; margin-top: 8px;">4</p>
        </div>
        <div style="background: #222930; padding: 20px; border-radius: 8px; border: 1px solid #2a333c;">
          <h3 style="font-size: 0.9rem; color: #8a99a8;">Critical Priority</h3>
          <p style="font-size: 2rem; font-weight: bold; color: #ef4444; margin-top: 8px;">1</p>
        </div>
        <div style="background: #222930; padding: 20px; border-radius: 8px; border: 1px solid #2a333c;">
          <h3 style="font-size: 0.9rem; color: #8a99a8;">Completion Rate</h3>
          <p style="font-size: 2rem; font-weight: bold; color: #10b981; margin-top: 8px;">25%</p>
        </div>
      </div>
    </section>
  </main>

  <!-- History View -->
  <main class="single-workspace" *ngIf="activeTab === 'history'">
    <section class="mfe-container history-workspace">
      <app-remote-loader remoteEntry="http://localhost:4202/remoteEntry.js" exposedModule="./HistoryWidget"
        exportName="HistoryWidgetComponent">
      </app-remote-loader>
    </section>
  </main>
</div>
