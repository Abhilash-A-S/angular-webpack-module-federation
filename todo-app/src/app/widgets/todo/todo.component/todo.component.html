<div class="section-header">
  <h2>My Tasks</h2>
  <p class="subtitle">{{ activeCount }} active • {{ criticalCount }} critical</p>
</div>

<!-- Add Task Bar -->
<div class="add-task-bar">
  <input 
    type="text" 
    placeholder="Add a task..." 
    class="task-input"
    [(ngModel)]="newTaskTitle"
    (keyup.enter)="addTask()">
  
  <div class="date-picker-wrapper">
    <input 
      class="date-select" 
      type="date" 
      [(ngModel)]="newTaskDate" 
      [min]="minDateString"
      (change)="onDateChange()">
  </div>

  <div class="time-picker-wrapper">
    <input 
      class="time-select" 
      type="time" 
      [(ngModel)]="newTaskTime"
      [min]="minTimeString">
  </div>

  <button 
    class="flag-toggle-btn" 
    [class.is-critical]="newTaskCritical" 
    (click)="toggleNewTaskCritical()"
    title="Toggle Critical Priority">
    🚩
  </button>

  <button class="add-btn" (click)="addTask()">+</button>
</div>

<!-- Task Items List -->
<div class="task-list">
  <div 
    *ngFor="let task of tasks" 
    class="task-item" 
    [class.due-now]="task.isDue && !task.completed"
    [class.completed]="task.completed">
    
    <label class="checkbox-container">
      <input 
        type="checkbox" 
        [checked]="task.completed" 
        (change)="toggleTaskComplete(task)">
      <span class="checkmark"></span>
      <span class="task-text">{{ task.title }}</span>
    </label>

    <span 
      class="task-flag" 
      [class.red-flag]="task.critical && !task.completed" 
      [class.orange-flag]="!task.critical && !task.completed"
      [class.green-flag]="task.completed"
      (click)="toggleTaskCritical(task)"
      title="Click to toggle Critical priority">
      🚩
    </span>

    <ng-container *ngIf="!task.completed">
      <div *ngIf="task.isDue && !task.completed" class="due-badge-group">
        <span class="time-stamp">{{ task.dueTime }}</span>
        <span class="badge">DUE NOW</span>
      </div>

      <button 
        *ngIf="task.isDue && !task.completed" 
        class="action-btn" 
        (click)="rescheduleTask(task)">
        Reschedule +5m
      </button>

      <span *ngIf="!task.isDue" class="task-time">{{ task.dueTime }}</span>
    </ng-container>
  </div>
</div>
