<div class="section-header">
  <h2>My Tasks</h2>
  <p class="subtitle">4 active • 1 critical</p>
</div>

<!-- Add Task Bar -->
<div class="add-task-bar">
  <input type="text" placeholder="Add a task..." class="task-input">
  <div class="time-picker-wrapper">
    <select class="time-select">
      <option>14:30</option>
      <option>15:00</option>
      <option>16:00</option>
    </select>
  </div>
  <button class="add-btn">+</button>
</div>

<!-- Task Items List -->
<div class="task-list">
  <!-- Item 1 -->
  <div class="task-item">
    <label class="checkbox-container">
      <input type="checkbox">
      <span class="checkmark"></span>
      <span class="task-text">Submit regional report</span>
    </label>
    <span class="task-flag red-flag">🚩</span>
    <span class="task-time">14:30</span>
  </div>

  <!-- Item 2 (Active/Due Alert State) -->
  <div class="task-item due-now">
    <label class="checkbox-container">
      <input type="checkbox">
      <span class="checkmark"></span>
      <span class="task-text">Prepare for standup</span>
    </label>
    <span class="task-flag orange-flag">🚩</span>
    <div class="due-badge-group">
      <span class="time-stamp">14:30</span>
      <span class="badge">DUE NOW</span>
    </div>
    <button class="action-btn">Reschedule +5m</button>
  </div>

  <!-- Item 3 -->
  <div class="task-item">
    <label class="checkbox-container">
      <input type="checkbox">
      <span class="checkmark"></span>
      <span class="task-text">Review pull request</span>
    </label>
    <span class="task-flag orange-flag">🚩</span>
    <span class="task-time">17:00</span>
  </div>

  <!-- Item 4 (Completed) -->
  <div class="task-item completed">
    <label class="checkbox-container">
      <input type="checkbox" checked disabled>
      <span class="checkmark"></span>
      <span class="task-text">Draft team announcement</span>
    </label>
    <span class="task-flag green-flag">🚩</span>
  </div>
</div>
