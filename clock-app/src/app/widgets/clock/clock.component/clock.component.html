<section class="mfe-container clock-widget">
  <h3 class="widget-title">System Overview</h3>
  <div class="clock-display">
    <div class="time">{{ currentTime || '14:30:05' }}</div>
    <div class="date">{{ currentDate || 'Fri, 17 July 2026' }}</div>
  </div>
  <p class="broadcast-note">Broadcasts tick via window.CustomEvent</p>
</section>
